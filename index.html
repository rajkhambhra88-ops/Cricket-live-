<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricFy TV - वैश्विक मुफ्त चैनल</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0e1a; --bg-2: #121829; --card: #1a2236; --card-hover: #232d47;
    --accent: #ff4757; --accent-2: #ff6b81; --text: #e8edf5; --text-dim: #8892b0;
    --radius: 14px;
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 100; background: rgba(10,14,26,.92); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.06); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; }
  .logo-icon { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-size: 20px; }
  .logo span { color: var(--accent); }
  .search-box { flex: 1; max-width: 380px; position: relative; }
  .search-box input { width: 100%; padding: 11px 16px 11px 42px; background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 30px; color: var(--text); font-size: .92rem; outline: none; }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before { content: '🔍'; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: .6; }
  .filters { display: flex; gap: 10px; padding: 16px 20px 6px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; flex: 1; padding-bottom: 4px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 8px 18px; border-radius: 30px; background: var(--card); border: 1px solid rgba(255,255,255,.08); color: var(--text-dim); font-size: .84rem; font-weight: 600; cursor: pointer; transition: .2s; user-select: none; }
  .chip:hover { color: var(--text); background: var(--card-hover); }
  .chip.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
  .lang-wrap { display: flex; align-items: center; gap: 8px; }
  .lang-wrap select { padding: 9px 16px; border-radius: 30px; background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,.1); font-size: .84rem; outline: none; cursor: pointer; }
  .grid { display: grid; gap: 16px; padding: 10px 20px 40px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,.06); transition: .25s; }
  .card:hover { transform: translateY(-5px); border-color: rgba(255,71,87,.45); }
  .card-thumb { aspect-ratio: 16/10; display: grid; place-items: center; font-size: 2.4rem; position: relative; background: linear-gradient(135deg, #232d47, #1a2236); }
  .card-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
  .card-live { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; font-size: .65rem; font-weight: 800; padding: 3px 9px; border-radius: 6px; }
  .card-info { padding: 12px 14px; }
  .card-info h3 { font-size: .9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-info p { font-size: .75rem; color: var(--text-dim); margin-top: 4px; }
  .cat-tag { background: rgba(255,71,87,.12); color: var(--accent); padding: 2px 8px; border-radius: 5px; font-size: .68rem; font-weight: 700; }
  .empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty div { font-size: 3rem; margin-bottom: 10px; }
  .modal { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,.92); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .player-box { width: 100%; max-width: 1000px; background: var(--bg-2); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
  .player-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .player-head h3 { font-size: 1rem; }
  .close-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,.08); color: var(--text); font-size: 18px; cursor: pointer; }
  .close-btn:hover { background: var(--accent); }
  .video-wrap { aspect-ratio: 16/9; background: #000; }
  .video-wrap video { width: 100%; height: 100%; display: block; }
  .load-more-wrap { grid-column: 1/-1; text-align: center; padding: 20px; }
  .load-more-wrap button { padding: 10px 30px; border-radius: 30px; background: var(--accent); color: #fff; border: none; font-weight: 700; cursor: pointer; }
  footer { text-align: center; padding: 28px 20px 40px; color: var(--text-dim); font-size: .8rem; line-height: 1.7; border-top: 1px solid rgba(255,255,255,.06); }
  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    .search-box { order: 3; flex-basis: 100%; max-width: 100%; }
    .filters { padding: 12px 14px 4px; }
    .grid { padding: 10px 14px 30px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-icon">📺</div>Cric<span>Fy</span></div>
  <div class="search-box"><input type="text" id="searchInput" placeholder="चैनल खोजें..."></div>
</header>

<div class="filters">
  <div class="chips" id="chips"></div>
  <div class="lang-wrap">
    <select id="langSelect">
      <option value="All">सभी भाषाएं</option>
    </select>
  </div>
</div>

<div class="grid" id="grid">
  <div class="empty"><div>⏳</div>श्रेणियाँ लोड हो रही हैं...</div>
</div>

<div class="modal" id="modal">
  <div class="player-box">
    <div class="player-head">
      <h3 id="playerTitle">📺 चैनल</h3>
      <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    <div class="video-wrap"><video id="video" controls autoplay playsinline></video></div>
  </div>
</div>

<footer>
  <div>© 2024 CricFy TV</div>
  <div style="font-size:.72rem;opacity:.7;max-width:700px;margin:8px auto 0;">
    ⚠️ केवल सार्वजनिक रूप से उपलब्ध Free-to-Air (FTA) स्ट्रीम। कोई कॉपीराइट सामग्री होस्ट या वितरित नहीं की जाती।
  </div>
</footer>

<script>
// ==================== वैश्विक स्थिति ====================
let ALL_CHANNELS = [];
let ALL_CATEGORIES = [];
let STREAM_MAP = {};
let LANG_MAP = {};
let activeCategory = null;
let activeLanguage = 'All';
let searchTerm = '';
const PAGE_SIZE = 80;

// ==================== प्रारंभ ====================
async function initApp() {
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="empty"><div>⏳</div>वैश्विक चैनल डेटा लोड हो रहा है...</div>`;

  try {
    const [channelsRes, categoriesRes, streamsRes, langsRes] = await Promise.all([
      fetch('https://iptv-org.github.io/api/channels.json'),
      fetch('https://iptv-org.github.io/api/categories.json'),
      fetch('https://iptv-org.github.io/api/streams.json'),
      fetch('https://iptv-org.github.io/api/languages.json')
    ]);

    const channelsData = await channelsRes.json();
    const categoriesData = await categoriesRes.json();
    const streamsData = await streamsRes.json();
    const langsData = await langsRes.json();

    // स्ट्रीम मैपिंग
    streamsData.forEach(s => {
      if (s.channel && !STREAM_MAP[s.channel]) STREAM_MAP[s.channel] = s.url;
    });

    // भाषा मैपिंग (कोड -> नाम)
    langsData.forEach(l => { LANG_MAP[l.code] = l.name; });

    // चैनल डेटा को मर्ज और फ़िल्टर करें (केवल स्ट्रीम और श्रेणी वाले रखें)
    ALL_CHANNELS = channelsData
      .filter(ch => STREAM_MAP[ch.id] && ch.categories && ch.categories.length > 0)
      .map(ch => ({
        id: ch.id,
        name: ch.name,
        icon: ch.logo || '📺',
        categories: ch.categories,
        languages: ch.languages || [],
        languageNames: (ch.languages || []).map(c => LANG_MAP[c] || c),
        url: STREAM_MAP[ch.id]
      }));

    // केवल उन श्रेणियों को रखें जिनमें वास्तव में चैनल हैं
    const catSet = new Set();
    ALL_CHANNELS.forEach(ch => ch.categories.forEach(c => catSet.add(c)));
    ALL_CATEGORIES = categoriesData.filter(c => catSet.has(c.id));

    // भाषा विकल्प लोड करें
    loadLanguageOptions(langsData);

    // श्रेणी चिप्स रेंडर करें
    renderCategoryChips();

    grid.innerHTML = `<div class="empty"><div>👆</div>कृपया ऊपर एक श्रेणी चुनें</div>`;

  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="empty"><div>😵</div>लोड विफल, कृपया रीफ्रेश करें<br><small>${err.message}</small></div>`;
  }
}

// ==================== भाषा विकल्प लोड करें ====================
function loadLanguageOptions(langsData) {
  const select = document.getElementById('langSelect');
  // केवल सामान्य भाषाएं दिखाएं (सभी दिखाने पर बहुत अधिक होंगी)
  const commonCodes = ['hin','eng','urd','ben','tam','tel','mal','kan','mar','guj','pan','ara','fra','spa','por','rus','ind','zho','jpn','kor'];
  const hiNames = { hin:'हिंदी', eng:'अंग्रेज़ी', urd:'उर्दू', ben:'बंगाली', tam:'तमिल', tel:'तेलुगु', mal:'मलयालम', kan:'कन्नड़', mar:'मराठी', guj:'गुजराती', pan:'पंजाबी', ara:'अरबी', fra:'फ्रेंच', spa:'स्पेनिश', por:'पुर्तगाली', rus:'रूसी', ind:'इंडोनेशियाई', zho:'चीनी', jpn:'जापानी', kor:'कोरियाई' };

  let html = '<option value="All">सभी भाषाएं</option>';
  commonCodes.forEach(code => {
    const found = langsData.find(l => l.code === code);
    if (found) {
      html += `<option value="${code}">${hiNames[code] || found.name}</option>`;
    }
  });
  select.innerHTML = html;

  select.onchange = (e) => {
    activeLanguage = e.target.value;
    if (activeCategory) renderGridForCategory(activeCategory);
  };
}

// ==================== श्रेणी चिप्स रेंडर करें ====================
function renderCategoryChips() {
  const wrap = document.getElementById('chips');
  const hiNames = {
    'sports':'खेल','news':'समाचार','movies':'फिल्में','music':'संगीत',
    'kids':'बच्चे','entertainment':'मनोरंजन','documentary':'डॉक्यूमेंट्री',
    'general':'सामान्य','comedy':'कॉमेडी','education':'शिक्षा','religious':'धार्मिक'
  };

  wrap.innerHTML = ALL_CATEGORIES.map(cat => {
    const name = hiNames[cat.id] || cat.name;
    const active = activeCategory === cat.id ? 'active' : '';
    return `<div class="chip ${active}" data-cat="${cat.id}">${name}</div>`;
  }).join('');

  wrap.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = chip.dataset.cat;
      renderGridForCategory(activeCategory);
    };
  });
}

// ==================== श्रेणी के अनुसार ग्रिड रेंडर करें ====================
function renderGridForCategory(catId) {
  const grid = document.getElementById('grid');
  let filtered = ALL_CHANNELS.filter(ch => ch.categories.includes(catId));

  // भाषा फ़िल्टर
  if (activeLanguage !== 'All') {
    filtered = filtered.filter(ch => ch.languages.includes(activeLanguage));
  }

  // खोज फ़िल्टर
  if (searchTerm) {
    filtered = filtered.filter(ch => ch.name.toLowerCase().includes(searchTerm));
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div>🔍</div>कोई मेल खाता चैनल नहीं मिला</div>`;
    return;
  }

  // पेजिनेशन
  const display = filtered.slice(0, PAGE_SIZE);
  grid.innerHTML = display.map(ch => cardHTML(ch, catId)).join('');

  // और लोड करें बटन
  if (filtered.length > PAGE_SIZE) {
    const wrap = document.createElement('div');
    wrap.className = 'load-more-wrap';
    wrap.innerHTML = `<button>और लोड करें (${filtered.length - PAGE_SIZE} शेष)</button>`;
    grid.appendChild(wrap);
    wrap.querySelector('button').onclick = () => {
      const rest = filtered.slice(PAGE_SIZE);
      wrap.remove();
      grid.insertAdjacentHTML('beforeend', rest.map(ch => cardHTML(ch, catId)).join(''));
      bindCardClicks();
    };
  }

  bindCardClicks();
}

function cardHTML(ch, catId) {
  const icon = ch.icon.startsWith('http')
    ? `<img src="${ch.icon}" alt="${ch.name}" loading="lazy">`
    : ch.icon;
  return `
    <div class="card" data-id="${ch.id}">
      <div class="card-thumb">${icon}<div class="card-live">LIVE</div></div>
      <div class="card-info">
        <h3>${ch.name}</h3>
        <p><span class="cat-tag">${catId}</span> ${ch.languageNames[0] || ''}</p>
      </div>
    </div>`;
}

function bindCardClicks() {
  document.querySelectorAll('.card').forEach(card => {
    card.onclick = () => {
      const ch = ALL_CHANNELS.find(c => c.id === card.dataset.id);
      if (ch) openPlayer(ch);
    };
  });
}

// ==================== प्लेयर ====================
let currentHls = null;

function openPlayer(ch) {
  document.getElementById('playerTitle').textContent = '📺 ' + ch.name;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';

  const video = document.getElementById('video');
  if (currentHls) { currentHls.destroy(); currentHls = null; }

  if (ch.url.includes('.m3u8')) {
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = ch.url;
      video.play().catch(()=>{});
    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      currentHls = new Hls({ enableWorker: true, lowLatencyMode: true });
      currentHls.loadSource(ch.url);
      currentHls.attachMedia(video);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    } else {
      video.src = ch.url;
    }
  } else {
    video.src = ch.url;
    video.play().catch(()=>{});
  }
}

function closePlayer() {
  const video = document.getElementById('video');
  video.pause();
  video.removeAttribute('src');
  video.load();
  if (currentHls) { currentHls.destroy(); currentHls = null; }
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closePlayer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

// ==================== खोज ====================
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim().toLowerCase();
  if (activeCategory) renderGridForCategory(activeCategory);
});

// ==================== प्रारंभ ====================
initApp();
</script>
</body>
</html>
